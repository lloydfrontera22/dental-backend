<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doctors — DentaCare Admin</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
</head><body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand">DentaCare</div><div class="clinic-name">&nbsp;</div>
    <nav id="sidebar-nav"></nav>
    <button class="btn btn-ghost logout" id="logout-btn">Log out</button>
  </aside>
  <main class="main">
    <div class="page-head"><div><h1>Doctors</h1><p>Add and manage the doctors at your clinic.</p></div></div>
    <div class="panel">
      <h2>Add a doctor</h2>
      <div class="row3">
        <div class="field"><label>Name</label><input id="d-name"></div>
        <div class="field"><label>Specialization</label><input id="d-spec" placeholder="e.g. Orthodontist"></div>
        <div class="field"><label>Phone</label><input id="d-phone"></div>
      </div>
      <button class="btn btn-primary" id="add-btn">Add doctor</button>
      <p class="status" id="add-status"></p>
    </div>
    <div class="panel">
      <h2>All doctors</h2>
      <table><thead><tr><th>Name</th><th>Specialization</th><th>Phone</th><th></th></tr></thead>
      <tbody id="rows"><tr><td colspan="4" class="muted">Loading…</td></tr></tbody></table>
    </div>
  </main>
</div>
<script src="admin.js"></script>
 <script src="doctors.js"></script>

</body></html>
